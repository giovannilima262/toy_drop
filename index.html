<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Toy Drop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-user-select:none;user-select:none}
  body{background:#2e6cb0 url(assets/background2.png) center/cover no-repeat;font-family:"Lilita One",sans-serif}   /* landscape: preenche as laterais */
  #wrap{height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #stage{position:relative;flex:none;background:#3a7ec2 url(assets/background.png) center/cover no-repeat;overflow:hidden}
  #stage.landscape{background:none}   /* landscape: fundo é o background2 do body — um OU o outro */
  #panelFrame{position:absolute;left:21.45%;top:17.7%;width:57.1%;height:64.8%;border-radius:calc(var(--u)*5) calc(var(--u)*5) 0 0;background:#277bdc;border:calc(var(--u)*1.6) solid #4499f2;box-shadow:0 calc(var(--u)*1.5) calc(var(--u)*5) rgba(6,40,100,.45), inset 0 calc(var(--u)*0.6) calc(var(--u)*1.5) rgba(9,50,120,.35)}
  canvas{position:absolute;display:block;touch-action:none}
  /* área de jogo perfeitamente centrada */
  #game{left:23.11%;top:19.85%;width:53.8%;height:61.6%}
  /* camada de efeitos: cobre a cena toda, SEM recorte — a comemoração voa pra fora do painel */
  #fx{left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1}

  /* barra superior */
  #topbar{position:absolute;top:2.6%;left:16%;right:16%;display:flex;align-items:center;justify-content:space-between;pointer-events:none;z-index:3}
  #topbar>*{pointer-events:auto}
  .icobtn{background:#fff;border:0;border-radius:30%;width:calc(var(--u)*9.5);height:calc(var(--u)*9.5);font-size:calc(var(--u)*4.6);line-height:1;box-shadow:0 calc(var(--u)*0.7) 0 rgba(20,50,90,.18);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .icobtn:active{transform:translateY(6%)}
  .pillrow{display:flex;gap:calc(var(--u)*2)}
  .pill{position:relative;display:flex;align-items:center;gap:calc(var(--u)*1.3);background:#fff;border-radius:999px;padding:calc(var(--u)*1) calc(var(--u)*2.4);box-shadow:0 calc(var(--u)*0.7) 0 rgba(20,50,90,.18)}
  .pill .ico{font-size:calc(var(--u)*3.8)}
  .pill b{font-size:calc(var(--u)*3.6);color:#2b3a55;font-weight:800;letter-spacing:.01em}
  .plus{position:absolute;right:calc(var(--u)*-1.4);top:50%;transform:translateY(-50%);width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);border-radius:50%;background:#37c463;color:#fff;font-size:calc(var(--u)*3);font-weight:800;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;box-shadow:0 calc(var(--u)*0.4) 0 rgba(20,50,90,.2)}

  /* objetivo: peças marcadas restantes por tipo, abaixo do painel */
  #tray{position:absolute;left:17%;right:17%;bottom:2.4%;height:calc(var(--u)*8.4);background:rgba(38,104,180,.5);border-radius:calc(var(--u)*4.2);display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*3.4);padding:0 calc(var(--u)*3);box-shadow:inset 0 calc(var(--u)*0.6) 0 rgba(10,40,80,.25);z-index:2}
  .gslot{position:relative;display:flex;align-items:center;justify-content:center}
  .gslot img{height:calc(var(--u)*3.6);object-fit:contain}
  .gslot b{position:absolute;right:calc(var(--u)*-1.7);top:calc(var(--u)*-1.9);min-width:calc(var(--u)*3.1);height:calc(var(--u)*3.1);padding:0 calc(var(--u)*0.7);border-radius:999px;background:#fff;color:#2b3a55;font-size:calc(var(--u)*2.1);font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 calc(var(--u)*0.35) 0 rgba(20,50,90,.28)}
  .gslot.done img{opacity:.4}
  .gslot.done b{background:#37c463;color:#fff}

  #shakeBtn{position:absolute;left:50%;bottom:21%;transform:translateX(-50%);display:none;pointer-events:auto;background:#ffb733;border:0;color:#5a3a00;border-radius:999px;padding:calc(var(--u)*1.4) calc(var(--u)*3);font-size:calc(var(--u)*3);font-weight:800;cursor:pointer;box-shadow:0 calc(var(--u)*0.7) 0 rgba(150,90,0,.4);z-index:3}
  #shakeBtn:active{transform:translateX(-50%) translateY(6%)}

  #overlay{position:absolute;inset:0;background:rgba(20,50,90,.55);display:none;align-items:center;justify-content:center;text-align:center;z-index:6}
  #overlay .card2{background:#fff;padding:calc(var(--u)*5) calc(var(--u)*5);border-radius:calc(var(--u)*5);max-width:74%;box-shadow:0 calc(var(--u)*1.2) 0 rgba(20,50,90,.25)}
  #overlay h1{margin:0 0 calc(var(--u)*1);font-size:calc(var(--u)*5.4);color:#2b3a55}
  #overlay .big{font-size:calc(var(--u)*9);font-weight:800;margin:calc(var(--u)*1) 0;color:#f5a623}
  #overlay p{font-size:calc(var(--u)*3);color:#5a6b85;margin:calc(var(--u)*2) 0}
  #overlay .btn{background:#37c463;border:0;color:#fff;border-radius:999px;padding:calc(var(--u)*2.2) calc(var(--u)*5);font-size:calc(var(--u)*3.8);font-weight:800;cursor:pointer;box-shadow:0 calc(var(--u)*0.8) 0 rgba(20,90,50,.4);margin-top:calc(var(--u)*1)}
  #overlay .btn.alt{background:#5b8bd0;box-shadow:0 calc(var(--u)*0.8) 0 rgba(30,60,120,.4)}
  #overlay .btn:active{transform:translateY(8%)}
  #overlay .row{display:flex;gap:calc(var(--u)*2);justify-content:center;flex-wrap:wrap}
  #overlay .adnote{font-size:calc(var(--u)*2.3);color:#9aa8bd;border:1px dashed #cdd8e6;border-radius:calc(var(--u)*2);padding:calc(var(--u)*1.4);margin-top:calc(var(--u)*2.4)}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="panelFrame"></div>
  <canvas id="game"></canvas>
  <canvas id="fx"></canvas>

  <div id="topbar">
    <button class="icobtn" id="gearBtn" aria-label="ajustes">⚙️</button>
    <div class="pillrow">
      <div class="pill"><span class="ico">🏆</span><b id="score">0</b></div>
      <div class="pill"><span class="ico">💎</span><b id="gems">0</b><button class="plus" id="gemPlus" aria-label="mais gemas">+</button></div>
    </div>
    <button class="icobtn" id="pauseBtn" aria-label="pausar">⏸️</button>
  </div>

  <div id="tray"></div>
  <button id="shakeBtn">📺 chacoalhar</button>
  <div id="overlay"></div>
</div></div>
<script src="js/matter.min.js"></script>
<script src="js/game.js"></script>
</body>
</html>
